    window.openGlobalModal = function(htmlContent) {
        const overlay = document.getElementById('global-modal-overlay');
        const content = document.getElementById('global-modal-content');
        
        content.innerHTML = htmlContent;
        overlay.classList.remove('hidden');
        
        // Force reflow to enable transition
        void overlay.offsetWidth;
        
        overlay.classList.remove('opacity-0');
        content.classList.remove('scale-95');

        // Safe MathJax Rendering inside popup
        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise([content]).catch(err => console.error(err));
        }
    };

    window.closeGlobalModal = function() {
        const overlay = document.getElementById('global-modal-overlay');
        const content = document.getElementById('global-modal-content');
        
        overlay.classList.add('opacity-0');
        content.classList.add('scale-95');
        
        setTimeout(() => {
            overlay.classList.add('hidden');
        }, 300);
    };

    window.openCoreModal = function(planetId) {

        let cumulativeVolume = 0;

            cumulativeVolume += layer.pct;
            const radiusPct = Math.cbrt(cumulativeVolume / 100) * 100;
            return { ...layer, radiusPct };
        });

        // 1. Cutaway Diagram HTML
        let cutawayHtml = '';
        [...processedLayers].reverse().forEach((layer) => {
            const shadow = `box-shadow: inset -15px -15px 30px rgba(0,0,0,0.6), inset 5px 5px 15px rgba(255,255,255,0.3), 0 10px 25px rgba(0,0,0,0.5);`;
            const border = layer.border ? `border: ${layer.border};` : '';

            cutawayHtml += `
                <div class="absolute rounded-full left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 transition-all duration-700 hover:scale-105"
                     style="width: ${layer.radiusPct}%; height: ${layer.radiusPct}%; background: ${layer.gradient}; ${shadow} ${border}" title="${layer.name} (${layer.material})">

        const generateMagLines = (planet) => {

            let svg = `<svg class="absolute inset-0 w-full h-full pointer-events-none z-20" viewBox="0 0 200 200">`;

                // Draw symmetric magnetic loops
                for(let i=1; i<=5; i++) {
                    let rx = 35 + i*18;
                    let ry = 50 + i*25;
                    let colorOpacity = Math.max(0.1, opacity - (i*0.08));
                    g += `<ellipse cx="0" cy="0" rx="${rx}" ry="${ry}" fill="none" stroke="rgba(110, 240, 255, ${colorOpacity})" stroke-width="1.5" />`;
                }
                // Magnetic Axis line indicator
                if(drawAxis) {
                    g += `<line x1="0" y1="-120" x2="0" y2="120" stroke="rgba(255,209,102,0.8)" stroke-width="2" stroke-dasharray="4 4" />`;
                }
                g += `</g>`;

                        <path d="M 120 140 Q 140 150 145 125" />
                        <path d="M 135 60 Q 150 50 155 70" />

                        <path d="M 90 120 Q 100 130 110 115" opacity="0.5"/>

    function init() {
        const tabContainer = document.getElementById('tab-container');
        tabs.forEach(tab => {
            const btn = document.createElement('button');
            btn.className = `tab-btn glass-panel px-4 py-2 rounded-full font-bold text-[10px] md:text-xs lg:text-sm text-space-100 ${tab.id === currentTab ? 'active' : ''}`;
            btn.innerHTML = tab.name;
            btn.onclick = () => switchTab(tab.id);
            btn.id = `btn-${tab.id}`;
            tabContainer.appendChild(btn);
        });
        switchTab(currentTab);

        // Allow mouse-wheel horizontal scrolling for the top tab container on Desktop browsers
        const scrollWrapper = tabContainer.parentElement;
        scrollWrapper.addEventListener('wheel', (evt) => {
            if (evt.deltaY !== 0) {
                evt.preventDefault();
                scrollWrapper.scrollLeft += evt.deltaY;
            }
        });
    }

    function switchTab(tabId) {
        currentTab = tabId;
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.id === `btn-${tabId}`) btn.classList.add('active');
        });

        const contentArea = document.getElementById('content-area');
        const tabObj = tabs.find(t => t.id === tabId);
        if(tabObj) {
            contentArea.innerHTML = tabObj.render();
        }

        if (tabId === 'calc') initCalculator();

        // Safe MathJax Rendering
        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise([contentArea]).catch(err => console.error(err));
        } else {
            setTimeout(() => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    MathJax.typesetPromise([contentArea]);
                }
            }, 500);
        }
    }

    function renderWindChart() {

            </p>

            <div class="space-y-4 relative z-10">
        `;

        planetData.forEach(p => {
            // Calculate dynamic animation speed based on windKmh
            let duration = 0;
            if (p.windKmh > 0) {
                // Base line: Earth 400km/h = ~1s to cross screen. Neptune 2100km/h = ~0.2s.
                duration = Math.max(0.2, 400 / p.windKmh);
            }

            // Generate streaks
            let streaksHtml = '';
            if (p.windKmh > 0) {
                for (let i = 0; i < 4; i++) {
                    let delay = Math.random() * 2; // offset starts
                    let top = 20 + Math.random() * 60; // vertical scatter
                    let width = 10 + Math.random() * 40; // varying streak lengths
                    let height = Math.random() > 0.5 ? 'h-0.5' : 'h-px';
                    
                    streaksHtml += `
                        <div class="absolute ${height} rounded-full" 
                             style="width: ${width}%; top: ${top}%; background: linear-gradient(90deg, transparent, ${p.colorCode}, transparent); 
                                    animation: windStreak ${duration}s linear infinite; animation-delay: ${delay}s; left: -100%;">
                        </div>
                    `;
                }
            } else {
                streaksHtml = `<div class="absolute inset-0 flex items-center justify-center text-[10px] text-space-100/50 uppercase tracking-widest">No Wind</div>`;
            }

            html += `
                <div class="bg-space-900/60 border border-space-500 rounded-xl p-3 flex flex-col md:flex-row gap-4 hover:border-star-cyan transition-colors shadow-lg group">
                    
                    <!-- Info Column -->

                            <span class="text-xs font-mono text-space-100 mb-1">km/h</span>

    function initCalculator() {
        const ageIn = document.getElementById('calc-age');
        const weightIn = document.getElementById('calc-weight');
        const renderResults = () => {
            const a = parseFloat(ageIn.value) || 0;
            const w = parseFloat(weightIn.value) || 0;
            
            const periods = { 'mercury': 0.24, 'venus': 0.615, 'earth': 1, 'mars': 1.88, 'jupiter': 11.86, 'saturn': 29.45, 'uranus': 84, 'neptune': 164.8 };
            
            let html = '';
            planetData.forEach(p => {
                const newWeight = (w * p.weightMultiplier).toFixed(1);
                const newAge = (a / periods[p.id]).toFixed(1);
                html += `
                    <div class="glass-panel p-4 text-center border-t-2" style="border-top-color: ${p.colorCode}">
                        <h3 class="font-display font-bold text-lg mb-4 text-white">${p.name}</h3>
                        <div class="bg-space-900 rounded p-2 mb-2">
                            <div class="text-[10px] text-space-100 uppercase tracking-wide">Your Weight</div>
                            <div class="font-mono text-xl text-star-gold">${newWeight}</div>
                        </div>
                        <div class="bg-space-900 rounded p-2">
                            <div class="text-[10px] text-space-100 uppercase tracking-wide">Your Age (Yrs)</div>
                            <div class="font-mono text-xl text-star-cyan">${newAge}</div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('calc-results').innerHTML = html;
        };
        
        ageIn.addEventListener('input', renderResults);
        weightIn.addEventListener('input', renderResults);
        renderResults();
    }

                    <div class="w-32 text-right text-xs font-mono text-star-gold">${g.spaceLabel}</div>
                    <div class="flex-grow bg-space-900 h-6 rounded-r overflow-hidden relative border-y border-r border-space-500">
                        <div class="h-full bg-star-red transition-all duration-1000 flex items-center px-2 text-[10px] font-bold text-white shadow-[0_0_10px_rgba(255,107,107,0.8)]" style="width: ${sPct}%">${g.spaceVal} ${g.unit}</div>
                    </div>
                </div>
            </div>
            `;
        });
        html += `</div>`;
        return html;
    }

    function renderTilt() {
        let html = `<div class="glass-panel p-6 mb-8 text-center">
            <h2 class="font-display text-2xl text-white mb-2">Spin & Tilt Visualizer</h2>
            <p class="text-sm text-space-100">A planet's axial tilt creates its seasons. Click on any planet below to see its exact tilt and learn how it affects its weather!</p>
        </div><div class="grid grid-cols-2 md:grid-cols-4 gap-8">`;
        
        planetData.forEach(p => {
            const rotDir = p.retrograde ? '↻ Backwards' : '↺ Forward';
            const colorClass = p.retrograde ? 'text-star-red' : 'text-star-green';
            
            html += `<button onclick="openTiltModal('${p.id}')" class="glass-panel p-4 text-center flex flex-col items-center cursor-pointer hover:border-star-cyan transition-colors group rounded-2xl w-full">
                <h3 class="font-display font-bold text-lg text-white mb-6 group-hover:text-star-cyan transition-colors">${p.name}</h3>
                
                <div class="relative w-20 h-20 mb-8 group-hover:scale-110 transition-transform">
                    <!-- Rotation Arrow -->
                    <div class="absolute -inset-4 border-2 border-dashed ${p.retrograde ? 'border-red-500/50' : 'border-green-500/50'} rounded-full z-0 animate-[spin_10s_linear_infinite]" style="animation-direction: ${p.retrograde ? 'reverse' : 'normal'}"></div>
                    
                    <!-- The Planet with Tilt -->
                    <div class="w-full h-full rounded-full relative z-10 planet-texture" style="background-color: ${p.colorCode}; transform: rotate(${p.tilt}deg)">
                        <!-- Equator Line -->
                        <div class="absolute top-1/2 left-0 w-full h-[1px] bg-white/50 shadow-[0_0_5px_white]"></div>
                        <!-- Axis Line -->
                        <div class="absolute left-1/2 -top-4 w-[2px] h-[calc(100%+32px)] bg-star-cyan/80 z-20" style="transform: translateX(-50%)"></div>
                    </div>
                </div>
                
                <div class="font-mono text-xl text-star-gold mb-1">${p.tilt}°</div>
                <div class="text-[10px] font-bold uppercase tracking-wider ${colorClass} bg-space-900 px-2 py-1 rounded border border-space-500 group-hover:border-white/20 transition-colors">${rotDir}</div>
            </button>`;
        });
        html += `</div>`;
        return html;
    }

    function renderSurvival() {
        let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">`;
        planetData.forEach(p => {
            const dangerColor = p.danger === 0 ? 'bg-star-green' : (p.danger < 8 ? 'bg-orange-500' : 'bg-star-red');
            const w = (p.danger / 10) * 100;
            
            html += `<div class="glass-panel p-4 flex flex-col">
                <h3 class="font-display font-bold text-xl text-white mb-2">${p.name}</h3>
                
                <div class="bg-space-900 h-4 rounded-full overflow-hidden mb-1 border border-space-500">
                    <div class="h-full ${dangerColor} transition-all duration-1000 relative" style="width: ${p.danger === 0 ? 100 : w}%"></div>
                </div>
                <div class="flex justify-between text-xs font-mono mb-4">
                    <span class="text-space-100">Danger Level:</span>
                    <span class="text-white font-bold">${p.danger}/10</span>
                </div>
                
                <div class="bg-space-900/50 p-3 rounded border border-space-500 flex-grow text-sm text-space-100 italic leading-relaxed">
                    " ${p.dangerReason} "
                </div>
            </div>`;
        });
        html += `</div>`;
        return html;
    }

    function renderScale() {
        let html = `<div class="glass-panel p-6 mb-8 text-center">
            <h2 class="font-display text-2xl text-white mb-2">The "Toilet Paper" Scale Model 🧻</h2>
            <p class="text-sm text-space-100 max-w-2xl mx-auto">In astronomy, 1 Astronomical Unit (AU) is the distance from the Sun to Earth. If 1 AU equals 1 square of toilet paper, here is how many squares away the other planets are!</p>
        </div><div class="space-y-6 overflow-x-auto hide-scrollbar pb-8">`;
        
        planetData.forEach(p => {
            const squaresCount = Math.round(p.distanceAU);
            const renderCount = Math.max(1, squaresCount); 
            
            let squaresHtml = '';
            for(let i=0; i<renderCount; i++) {
                squaresHtml += `<div class="tp-square"><div class="w-8 h-8 rounded-full opacity-${i === renderCount-1 ? '100 shadow-[0_0_10px_white]' : '0'}" style="background-color: ${p.colorCode}"></div></div>`;
            }

            html += `
            <div class="flex items-center gap-4 min-w-max">
                <div class="w-32 text-right flex-shrink-0">
                    <div class="font-display font-bold text-lg text-white">${p.name}</div>
                    <div class="font-mono text-xs text-star-cyan">${p.distanceAU} AU</div>
                </div>
                <div class="flex border-l-4 border-yellow-500 pl-1 py-2 relative">
                    <div class="absolute -left-[14px] top-1/2 transform -translate-y-1/2 text-2xl">☀️</div>
                    ${squaresHtml}
                </div>
                <div class="font-mono text-sm text-space-100 ml-2 border border-space-500 bg-space-900 px-2 py-1 rounded">
                    ~${renderCount} square${renderCount !== 1 ? 's' : ''}
                </div>
            </div>
            `;
        });
        html += `</div>`;
        return html;
    }

    // Initialize the app
    window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
