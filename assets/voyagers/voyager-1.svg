<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Voyager 1 spacecraft illustration</title>
  <desc id="desc">A realistic vector illustration of the Voyager 1 spacecraft with its dish antenna, booms, instruments, and radioisotope generators against deep space.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="55%" stop-color="#081328"/>
      <stop offset="100%" stop-color="#140d26"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.1" cy="0.15" r="0.8">
      <stop offset="0%" stop-color="#ffe8a3" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#ffd166" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dishRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#bfc7d6"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="dishFace" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#fefefe"/>
      <stop offset="38%" stop-color="#cbd5e1"/>
      <stop offset="68%" stop-color="#7c8aa0"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4c7"/>
      <stop offset="18%" stop-color="#f6d87b"/>
      <stop offset="46%" stop-color="#cb962c"/>
      <stop offset="70%" stop-color="#8f5d0d"/>
      <stop offset="100%" stop-color="#f5d877"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#space)"/>
  <circle cx="160" cy="160" r="290" fill="url(#sunGlow)"/>
  <g fill="#ffffff">
    <circle cx="120" cy="912" r="2.2"/>
    <circle cx="232" cy="804" r="2.4"/>
    <circle cx="1008" cy="132" r="2"/>
    <circle cx="960" cy="286" r="1.6"/>
    <circle cx="1048" cy="848" r="2.1"/>
    <circle cx="796" cy="136" r="1.8"/>
    <circle cx="884" cy="1028" r="2.4"/>
    <circle cx="620" cy="1020" r="1.7"/>
    <circle cx="420" cy="120" r="1.5"/>
    <circle cx="160" cy="482" r="1.4"/>
    <circle cx="1094" cy="506" r="1.9"/>
    <circle cx="364" cy="1038" r="2.2"/>
  </g>

  <g transform="translate(610 620) rotate(-19)">
    <ellipse cx="-230" cy="-170" rx="235" ry="235" fill="#ffe8a3" opacity="0.12" filter="url(#softGlow)"/>
    <circle cx="-230" cy="-170" r="214" fill="none" stroke="url(#dishRim)" stroke-width="16"/>
    <circle cx="-230" cy="-170" r="196" fill="url(#dishFace)" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="-230" cy="-170" r="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>
    <path d="M-230 -170 L-40 -4" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
    <path d="M-230 -170 L-68 -62" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M-230 -170 L-104 62" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

    <g transform="translate(0 0)">
      <rect x="-36" y="-68" width="132" height="146" rx="10" fill="url(#goldFoil)" stroke="#fef3c7" stroke-width="4"/>
      <rect x="-18" y="-46" width="96" height="102" rx="8" fill="#73541a" opacity="0.22"/>
      <rect x="-8" y="-20" width="78" height="18" rx="4" fill="url(#metal)"/>
      <rect x="-8" y="8" width="78" height="18" rx="4" fill="url(#metal)"/>
      <rect x="-8" y="36" width="78" height="18" rx="4" fill="url(#metal)"/>
    </g>

    <g stroke="#cbd5e1" stroke-linecap="round">
      <path d="M74 -48 L224 -72" stroke-width="8"/>
      <path d="M74 -8 L214 12" stroke-width="7"/>
      <path d="M62 52 L202 134" stroke-width="7"/>
      <path d="M-4 74 L-68 264" stroke-width="10"/>
      <path d="M98 72 L332 318" stroke-width="8"/>
      <path d="M92 -70 L278 -278" stroke-width="7"/>
    </g>

    <g transform="translate(260 -290)">
      <rect x="-16" y="-16" width="28" height="182" rx="8" fill="url(#metal)"/>
      <circle cx="-2" cy="182" r="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="5"/>
      <circle cx="-2" cy="182" r="9" fill="#1e3a8a"/>
    </g>

    <g transform="translate(344 332)">
      <rect x="-10" y="-8" width="158" height="18" rx="7" fill="url(#metal)"/>
      <circle cx="164" cy="1" r="22" fill="#111827" stroke="#cbd5e1" stroke-width="5"/>
      <circle cx="164" cy="1" r="7" fill="#6ef0ff"/>
    </g>

    <g transform="translate(-76 290)">
      <path d="M0 0 L-76 40" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 0 L-8 124" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 0 L84 74" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
      <g fill="#3f3f46" stroke="#fbbf24" stroke-width="4">
        <circle cx="-86" cy="46" r="28"/>
        <circle cx="-12" cy="138" r="28"/>
        <circle cx="94" cy="80" r="28"/>
      </g>
    </g>

    <g transform="translate(215 145)">
      <rect x="-10" y="-58" width="22" height="116" rx="7" fill="url(#metal)"/>
      <rect x="16" y="-48" width="66" height="20" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="4"/>
      <rect x="16" y="-16" width="48" height="18" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="4"/>
      <rect x="16" y="16" width="58" height="18" rx="6" fill="#111827" stroke="#9ca3af" stroke-width="4"/>
    </g>

    <g transform="translate(235 -70)" fill="#111827" stroke="#cbd5e1" stroke-width="4">
      <circle cx="0" cy="0" r="18"/>
      <circle cx="34" cy="-24" r="12"/>
      <circle cx="44" cy="22" r="12"/>
    </g>

    <g transform="translate(226 6)" fill="#111827" stroke="#cbd5e1" stroke-width="4">
      <rect x="-14" y="-14" width="28" height="28" rx="6"/>
      <circle cx="36" cy="0" r="12"/>
    </g>

    <g transform="translate(196 126)" fill="#0f172a" stroke="#cbd5e1" stroke-width="4">
      <rect x="-18" y="-16" width="34" height="34" rx="7"/>
      <circle cx="30" cy="-20" r="12"/>
      <circle cx="28" cy="20" r="12"/>
    </g>
  </g>

  <g fill="#f8fafc" opacity="0.9">
    <text x="86" y="1062" font-family="JetBrains Mono, monospace" font-size="28" letter-spacing="5">VOYAGER 1</text>
    <text x="86" y="1098" font-family="Nunito, sans-serif" font-size="20" opacity="0.72">Interstellar mission profile illustration</text>
  </g>
</svg>
