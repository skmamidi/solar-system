      <circle cx="-2" cy="182" r="22" fill="#dbeafe" stroke="#7dd3fc" stroke-width="5"/>
      <circle cx="-2" cy="182" r="9" fill="#0f172a"/>
    </g>

    <g transform="translate(346 326)">
