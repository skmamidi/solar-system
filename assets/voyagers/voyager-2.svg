<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Voyager 2 spacecraft illustration</title>
  <desc id="desc">A realistic vector illustration of the Voyager 2 spacecraft with a cool-blue deep space backdrop, showing its dish antenna, booms, instruments, and power generators.</desc>
  <defs>
    <linearGradient id="space2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#071b31"/>
      <stop offset="100%" stop-color="#04122a"/>
    </linearGradient>
    <radialGradient id="neptuneGlow" cx="0.86" cy="0.18" r="0.72">
      <stop offset="0%" stop-color="#8ce7ff" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#6ef0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6ef0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dishRim2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b6c5d8"/>
      <stop offset="100%" stop-color="#526579"/>
    </linearGradient>
    <radialGradient id="dishFace2" cx="0.42" cy="0.34" r="0.8">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#d6e0ec"/>
      <stop offset="72%" stop-color="#7f92a8"/>
      <stop offset="100%" stop-color="#243447"/>
    </radialGradient>
    <linearGradient id="foil2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="24%" stop-color="#e8c267"/>
      <stop offset="50%" stop-color="#bb8a28"/>
      <stop offset="70%" stop-color="#7a510b"/>
      <stop offset="100%" stop-color="#f7d97e"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#9db0c3"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#space2)"/>
  <circle cx="1010" cy="170" r="260" fill="url(#neptuneGlow)"/>
  <g fill="#ffffff">
    <circle cx="162" cy="120" r="2"/>
    <circle cx="238" cy="810" r="1.7"/>
    <circle cx="370" cy="956" r="2.2"/>
    <circle cx="1036" cy="914" r="2.2"/>
    <circle cx="904" cy="1048" r="1.8"/>
    <circle cx="892" cy="152" r="1.7"/>
    <circle cx="1048" cy="344" r="1.6"/>
    <circle cx="760" cy="92" r="2.1"/>
    <circle cx="118" cy="614" r="1.5"/>
    <circle cx="516" cy="144" r="1.9"/>
    <circle cx="1080" cy="618" r="2.3"/>
    <circle cx="604" cy="1066" r="1.6"/>
  </g>

  <g transform="translate(620 618) rotate(17)">
    <ellipse cx="-228" cy="-174" rx="235" ry="235" fill="#6ef0ff" opacity="0.12" filter="url(#blueGlow)"/>
    <circle cx="-228" cy="-174" r="214" fill="none" stroke="url(#dishRim2)" stroke-width="16"/>
    <circle cx="-228" cy="-174" r="196" fill="url(#dishFace2)" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="-228" cy="-174" r="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>
    <path d="M-228 -174 L-34 -8" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
