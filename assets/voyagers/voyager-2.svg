      <circle cx="36" cy="0" r="12"/>
    </g>

    <g transform="translate(198 126)" fill="#0f172a" stroke="#cbd5e1" stroke-width="4">
      <rect x="-18" y="-16" width="34" height="34" rx="7"/>
      <circle cx="30" cy="-20" r="12"/>
      <circle cx="28" cy="20" r="12"/>
    </g>
  </g>

  <g fill="#e0f2fe" opacity="0.92">
    <text x="84" y="1064" font-family="JetBrains Mono, monospace" font-size="28" letter-spacing="5">VOYAGER 2</text>
    <text x="84" y="1100" font-family="Nunito, sans-serif" font-size="20" opacity="0.72">Grand Tour mission profile illustration</text>
  </g>
</svg>
