      <path d="M2 74 L-64 264" stroke-width="10"/>
      <path d="M102 72 L336 314" stroke-width="8"/>
      <path d="M98 -74 L290 -276" stroke-width="7"/>
    </g>

    <g transform="translate(270 -288)">
